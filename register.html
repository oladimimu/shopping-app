<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <!-- <link rel="stylesheet" href="product.css"> -->

</head>
<style>
    body{
        background: linear-gradient(rgb(18, 71, 112),rgb(218, 218, 246) 4%);
        margin-top: 70px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 400;
    }
    .Register-container{
        text-align: center;
        justify-content: center;
        margin: auto;
        padding: 20px;
        background: linear-gradient(rgb(60, 60, 172) 0%,rgb(106, 178, 255) 2%,#435775);
        width: 280px;
        border-radius: 10px;
        box-shadow: 1px 2px 1px;
    }
    input{
        margin: 10px;
        padding: 10px 15px;
        border-left: none;
        border-top: none;
        border-right: none;
        border-radius: 7px;
        color: #f1f2f6;
        background-color: black;
        font-weight: 800;
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 1px;
    }
    h1{
        font-weight: bold;
        color: white;
    }
    button{
        padding: 7px;
        border: none;
        border-radius: 5px;
        width: 200px;
        font-size: 16px;
        color: white;
        font-weight: 800;
        background-color: rgb(122, 122, 243);
    }
    button:focus{
        background-color: rgb(26, 26, 27);
    }
    a{
        text-decoration: none;
        margin-left: 2px;
    }
    a:hover{
        text-decoration: underline;
    }
    .account{
        font-size: small;
    }
    .FullName-box{
        position: relative;
        display: inline-block;
    }
    .FullName-box input{
        padding-right: 17px;
    }
    .FullName-box svg{
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
    }
    @media (max-width: 700px){
        .Register-container{
                margin: 0%;
                padding: auto;
                justify-content: center;
                text-align: center;
                border: none;
                background: none;
                box-shadow: none;
                margin-top: 50px;
        }
        input{
                border-bottom-right-radius: 19px;
                border-bottom: #fcfcfc;
            }
        body{
            flex-wrap: wrap;
            overflow-x: hidden;
            background: linear-gradient(#435775,#7bda37);
            color: #fcfcfc;
            text-align: center;
            justify-content: center;
        }
    }
</style>
<body>
    <div class="Register-container">
        <h1>Create Account</h1>
        <p>Register to start shopping</p>
        <div class="FullName-box">
            <input type="text" id="registerName" placeholder="Full Name">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M720-400v-120H600v-80h120v-120h80v120h120v80H800v120h-80ZM247-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm80-80h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q440-607 440-640t-23.5-56.5Q393-720 360-720t-56.5 23.5Q280-673 280-640t23.5 56.5Q327-560 360-560t56.5-23.5ZM360-640Zm0 400Z"/></svg>
            <br>
        </div>
        <div class="FullName-box">
            <input type="password" id="registerPassword" placeholder="Password">
            <svg onclick="showpein()" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#FFFFFF"><path d="m637-425-62-62q4-38-23-65.5T487-576l-62-62q13-5 27-7.5t28-2.5q70 0 119 49t49 119q0 14-2.5 28t-8.5 27Zm133 133-52-52q36-28 65.5-61.5T833-480q-49-101-144.5-158.5T480-696q-26 0-51 3t-49 10l-58-58q38-15 77.5-21t80.5-6q143 0 261.5 77.5T912-480q-22 57-58.5 103.5T770-292Zm-2 202L638-220q-38 14-77.5 21t-80.5 7q-143 0-261.5-77.5T48-480q22-57 58-104t84-85L90-769l51-51 678 679-51 51ZM241-617q-35 28-65 61.5T127-480q49 101 144.5 158.5T480-264q26 0 51-3.5t50-9.5l-45-45q-14 5-28 7.5t-28 2.5q-70 0-119-49t-49-119q0-14 3.5-28t6.5-28l-81-81Zm287 89Zm-96 96Z"/></svg>
            <br>
        </div>
        <div class="FullName-box">
            <input type="text" id="registerAddress" placeholder="Address">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="20px" fill="#FFFFFF"><path d="M324-111.5Q251-143 197-197t-85.5-127Q80-397 80-480t31.5-156Q143-709 197-763t127-85.5Q397-880 480-880t156 31.5Q709-817 763-763t85.5 127Q880-563 880-480t-31.5 156Q817-251 763-197t-127 85.5Q563-80 480-80t-156-31.5ZM480-160q56 0 105.5-17.5T676-227l-57-57q-29 21-64.5 32.5T480-240q-100 0-170-70t-70-170q0-100 70-170t170-70q100 0 170 70t70 170q0 39-12 75t-33 65l57 57q32-41 50-91t18-106q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-160q22 0 42.5-5.5T561-342l-61-61q-5 2-10 2.5t-10 .5q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 6-.5 11.5T557-458l60 60q11-18 17-38.5t6-43.5q0-66-47-113t-113-47q-66 0-113 47t-47 113q0 66 47 113t113 47Z"/></svg>
            <br>
        </div>
        <div class="FullName-box">
            <input type="text" id="registerPlace" placeholder="Place / Location">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="20px" fill="#FFFFFF"><path d="M307-113.5Q240-147 240-200q0-24 14.5-44.5T295-280l63 59q-9 4-19.5 9T322-200q13 16 60 28t98 12q51 0 98.5-12t60.5-28q-7-8-18-13t-21-9l62-60q28 16 43 36.5t15 45.5q0 53-67 86.5T480-80q-106 0-173-33.5ZM481-300q99-73 149-146.5T680-594q0-102-65-154t-135-52q-70 0-135 52t-65 154q0 67 49 139.5T481-300Zm-1 100Q339-304 269.5-402T200-594q0-71 25.5-124.5T291-808q40-36 90-54t99-18q49 0 99 18t90 54q40 36 65.5 89.5T760-594q0 94-69.5 192T480-200Zm0-320q33 0 56.5-23.5T560-600q0-33-23.5-56.5T480-680q-33 0-56.5 23.5T400-600q0 33 23.5 56.5T480-520Zm0-80Z"/></svg>
            <br>
        </div>
        <button onclick="registerBtn()">Register</button>
        <p id="message"></p>
        <p class="account">Already have an account?<a href="login.html">Login</a></p>
    </div>
    <script>
       const registerBtn = () => {
            if (
                registerName.value === "" ||
                registerPassword.value === "" ||
                registerAddress.value === "" ||
                registerPlace.value === ""
            ) {
                message.innerText = "Please fill all the fields";
                return;
            }
            const user = {
                name: registerName.value,
                password: registerPassword.value,
                address: registerAddress.value,
                place: registerPlace.value
            };

            localStorage.setItem("user", JSON.stringify(user));
            message.innerText = "Registration successful!";
            setTimeout(function () {
                window.location.href = "login.html";
            }, 1000);
        };
        const showpein = () =>{
            if (registerPassword.type === "password"){
                registerPassword.type = "text"
        }else{
            registerPassword.type = "password"
            
        }
        }
    </script>
</body>
</html>
